<script id="reader-code">
(() => {
  'use strict';
  const vault = JSON.parse(document.getElementById('encrypted-notebook').textContent);
  const gate = document.getElementById('gate');
  const reader = document.getElementById('reader');
  const pdfView = document.getElementById('pdf-view');
  const pdfStage = document.getElementById('pdf-stage');
  const pdfPaper = document.getElementById('pdf-paper');
  const pdfMessage = document.getElementById('pdf-message');
  const pdfBase = 'https://zzywantbegreat.github.io/mfg/vendor/pdfjs/';
  let pdfDocumentPromise;
  let pdfNumber = 1;
  let pdfZoom = 1;
  let pdfRenderId = 0;
  const form = document.getElementById('unlock-form');
  const input = document.getElementById('access-password');
  const button = document.getElementById('open-button');
  const status = document.getElementById('status');
  const storageKey = 'meeting-notes:' + location.pathname + ':' + vault.salt;
  const encoder = new TextEncoder();
  const urls = new Map();
  let notebook = null;
  let currentPage = '';

  function fromBase64(text) {
    return Uint8Array.from(atob(text), c => c.charCodeAt(0));
  }
  function toBase64(bytes) {
    return btoa(String.fromCharCode(...bytes));
  }
  function storedKey() {
    try { return sessionStorage.getItem(storageKey); } catch { return null; }
  }
  function forgetKey() {
    try { sessionStorage.removeItem(storageKey); } catch {}
  }
  function setBusy(busy) {
    input.disabled = button.disabled = busy;
    button.textContent = busy ? '正在打开…' : '打开笔记';
  }
  function route(file, anchor = '') {
    return '#' + file + (anchor ? '@' + encodeURIComponent(anchor) : '');
  }
  function assetURL(path) {
    if (!urls.has(path)) {
      const asset = notebook.assets[path];
      urls.set(path, URL.createObjectURL(new Blob([fromBase64(asset.data)], {type: asset.mime})));
    }
    return urls.get(path);
  }
  async function loadPDF() {
    if (!pdfDocumentPromise) pdfDocumentPromise = (async () => {
      const library = await import(pdfBase + 'pdf.mjs');
      library.GlobalWorkerOptions.workerSrc = pdfBase + 'pdf.worker.mjs';
      return library.getDocument({
        data: fromBase64(notebook.assets['output/pdf/notes.pdf'].data),
        cMapUrl: pdfBase + 'cmaps/', cMapPacked: true,
        standardFontDataUrl: pdfBase + 'standard_fonts/',
        wasmUrl: pdfBase + 'wasm/', isEvalSupported: false, useWasm: false,
      }).promise;
    })();
    return pdfDocumentPromise;
  }
  async function showPDF(anchor) {
    reader.hidden = true;
    pdfView.hidden = false;
    document.body.dataset.view = 'pdf';
    document.title = notebook.title;
    currentPage = 'pdf';
    const url = assetURL('output/pdf/notes.pdf');
    const destination = anchor || 'main-theorem';
    const src = url + (destination.startsWith('page:')
      ? '#page=' + encodeURIComponent(destination.slice(5))
      : '#nameddest=' + encodeURIComponent(destination)) + '&view=FitH';
    document.getElementById('pdf-download').href = url;
    document.getElementById('pdf-open').href = src;
    const renderId = ++pdfRenderId;
    pdfMessage.textContent = '正在打开 PDF…';
    try {
      const pdf = await loadPDF();
      const dest = destination.startsWith('page:') ? null : await pdf.getDestination(destination);
      const pageNumber = dest ? (Number.isInteger(dest[0]) ? dest[0] : await pdf.getPageIndex(dest[0])) + 1
        : Math.max(1, Math.min(pdf.numPages, Number(destination.slice(5)) || 1));
      const page = await pdf.getPage(pageNumber);
      const viewport = page.getViewport({scale: Math.min(900, pdfStage.clientWidth - 30) / page.getViewport({scale:1}).width * pdfZoom});
      const canvas = document.createElement('canvas');
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.ceil(viewport.width * pixelRatio);
      canvas.height = Math.ceil(viewport.height * pixelRatio);
      canvas.style.width = viewport.width + 'px';
      canvas.style.height = viewport.height + 'px';
      canvas.setAttribute('aria-label', '10.12组会，第 ' + pageNumber + ' 页');
      await page.render({canvasContext:canvas.getContext('2d'),viewport,
        transform:pixelRatio === 1 ? null : [pixelRatio,0,0,pixelRatio,0,0]}).promise;
      const annotations = await page.getAnnotations();
      if (renderId !== pdfRenderId || currentPage !== 'pdf') return;
      pdfPaper.style.width = viewport.width + 'px';
      pdfPaper.replaceChildren(canvas);
      const names = {'main-theorem':'主定理','subsequence-existence':'思路 1：先考察收敛子列的存在性',
        'limit-identification':'思路 2：研究并确定这些收敛子列的极限',
        'sequence-convergence':'思路 3：由此证明整个序列收敛',
        'particle-system':'粒子系统','assumptions-card':'系数与初始条件',
        'proof-tightness-criterion':'定理 3.8.6 的证明','proof-neighborhood-lemma':'引理 4.1 的证明',
        'proof-increment-lemma':'引理 4.2 的证明','tightness-criterion':'返回定理 3.8.6',
        'neighborhood-lemma':'返回引理 4.1','increment-lemma':'返回引理 4.2'};
      for (const annotation of annotations) {
        if (annotation.subtype !== 'Link' || typeof annotation.dest !== 'string') continue;
        const rect = [
          ...viewport.convertToViewportPoint(annotation.rect[0], annotation.rect[1]),
          ...viewport.convertToViewportPoint(annotation.rect[2], annotation.rect[3]),
        ];
        const link = document.createElement('a');
        link.className = 'pdf-link';
        link.href = '#pdf@' + encodeURIComponent(annotation.dest);
        link.setAttribute('aria-label', names[annotation.dest] || '返回本节开头');
        link.title = names[annotation.dest] || '返回本节开头';
        Object.assign(link.style, {left:Math.min(rect[0],rect[2])+'px',top:Math.min(rect[1],rect[3])+'px',
          width:Math.abs(rect[2]-rect[0])+'px',height:Math.abs(rect[3]-rect[1])+'px'});
        pdfPaper.append(link);
      }
      pdfNumber = pageNumber;
      document.getElementById('pdf-page-label').textContent = pageNumber + ' / ' + pdf.numPages;
      document.getElementById('pdf-prev').disabled = pageNumber === 1;
      document.getElementById('pdf-next').disabled = pageNumber === pdf.numPages;
      pdfMessage.textContent = '';
      const top = dest?.[1]?.name === 'XYZ' && Number.isFinite(dest[3]) ? viewport.convertToViewportPoint(0,dest[3])[1] : 0;
      pdfStage.scrollTop = top > 160 ? top - 40 : 0;
    } catch (error) {
      if (renderId !== pdfRenderId) return;
      console.error('PDF preview failed:', error);
      pdfDocumentPromise = null;
      pdfMessage.textContent = 'PDF 预览暂时无法加载，可以使用上方“下载 PDF”打开。';
    }
  }
  document.getElementById('pdf-prev').addEventListener('click', () => { location.hash = 'pdf@page:' + Math.max(1,pdfNumber-1); });
  document.getElementById('pdf-next').addEventListener('click', () => { location.hash = 'pdf@page:' + (pdfNumber+1); });
  document.getElementById('pdf-zoom-out').addEventListener('click', () => { pdfZoom = Math.max(.5,pdfZoom/1.2); showPDF('page:'+pdfNumber); });
  document.getElementById('pdf-zoom-in').addEventListener('click', () => { pdfZoom = Math.min(2.5,pdfZoom*1.2); showPDF('page:'+pdfNumber); });
  function showPage() {
    if (!notebook) return;
    const fragment = location.hash.slice(1);
    const separator = fragment.indexOf('@');
    let page = (separator < 0 ? fragment : fragment.slice(0, separator)) || 'notes.html';
    let anchor = '';
    try { anchor = separator < 0 ? '' : decodeURIComponent(fragment.slice(separator + 1)); } catch {}
    if (page === 'pdf') { showPDF(anchor); return; }
    if (!Object.hasOwn(notebook.pages, page)) page = 'notes.html';
    pdfView.hidden = true;
    reader.hidden = false;
    document.body.dataset.view = 'html';
    if (currentPage !== page) {
      reader.innerHTML = notebook.pages[page].body;
      currentPage = page;
      const title = notebook.pages[page].title.split(' · ')[0];
      document.title = page === 'notes.html' ? notebook.title : title + ' · ' + notebook.title;
      for (const link of reader.querySelectorAll('a[href]')) {
        const target = new URL(link.getAttribute('href'), 'https://notebook.invalid/' + page);
        if (target.origin !== 'https://notebook.invalid') continue;
        const path = decodeURIComponent(target.pathname.slice(1));
        if (Object.hasOwn(notebook.pages, path)) {
          link.href = route(path, target.hash.slice(1));
          link.removeAttribute('target');
        } else if (path === 'output/pdf/notes.pdf') {
          link.href = '#pdf';
          link.removeAttribute('target');
        } else if (Object.hasOwn(notebook.assets, path)) {
          const asset = notebook.assets[path];
          link.href = assetURL(path);
          link.rel = 'noopener noreferrer';
          if (link.hasAttribute('download')) link.download = asset.name;
        }
      }
    }
    const requestedPage = page;
    document.fonts.ready.then(() => {
      if (currentPage !== requestedPage) return;
      const target = anchor ? document.getElementById(anchor) : null;
      if (target && reader.contains(target)) target.scrollIntoView();
      else window.scrollTo(0, 0);
    });
  }

  async function unlock(rawKey) {
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({
      name: 'AES-GCM', iv: fromBase64(vault.iv), additionalData: encoder.encode(vault.aad), tagLength: 128,
    }, key, fromBase64(vault.ciphertext));
    const stream = new Blob([plaintext]).stream().pipeThrough(new DecompressionStream('gzip'));
    const decoded = await new Response(stream).json();
    if (decoded.version !== 1 || !decoded.pages?.['notes.html'] || !decoded.css || !decoded.assets) throw new Error('Invalid notebook');
    notebook = decoded;
    document.getElementById('notebook-style').textContent = notebook.css;
    gate.hidden = true;
    reader.hidden = false;
    input.value = '';
    try { sessionStorage.setItem(storageKey, toBase64(rawKey)); } catch {}
    showPage();
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled || !input.value) return;
    let password = encoder.encode(input.value);
    input.value = '';
    status.textContent = '';
    setBusy(true);
    let rawKey;
    try {
      const passwordKey = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveBits']);
      password.fill(0);
      rawKey = new Uint8Array(await crypto.subtle.deriveBits({
        name: 'PBKDF2', hash: 'SHA-256', salt: fromBase64(vault.salt), iterations: vault.iterations,
      }, passwordKey, 256));
      await unlock(rawKey);
    } catch {
      forgetKey();
      status.textContent = '密码不正确，请重新输入。';
    } finally {
      password.fill(0);
      rawKey?.fill(0);
      setBusy(false);
      if (!notebook) input.focus();
    }
  });
  window.addEventListener('hashchange', showPage);
  pdfView.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#pdf"]');
    if (link && link.hash === location.hash) {
      event.preventDefault();
      showPage();
    }
  });

  async function restoreSession() {
    if (!window.crypto?.subtle || !window.DecompressionStream) {
      status.textContent = '请使用较新版本的浏览器打开此笔记。';
      input.disabled = button.disabled = true;
      return;
    }
    const saved = storedKey();
    if (!saved) return;
    setBusy(true);
    let rawKey;
    try {
      rawKey = fromBase64(saved);
      await unlock(rawKey);
    } catch {
      forgetKey();
    } finally {
      rawKey?.fill(0);
      setBusy(false);
    }
  }
  restoreSession();
})();
</script>
</body>
