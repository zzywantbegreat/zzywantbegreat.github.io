name: Recover stalled Pages deployment

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/recover-pages-deployment.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stalled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the stalled photo deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/${GH_REPO}/pages/deployments/8382bc69129b47488b0a71b4bbf36e89ce154faf/cancel"
