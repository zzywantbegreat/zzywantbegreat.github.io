<link rel="stylesheet" href="{{ '/assets/css/codex-activity.css' | relative_url }}">
<section class="codex-activity" data-codex-activity data-source="{{ '/assets/data/codex-usage.json' | relative_url }}" aria-label="Token 用量">
  <div class="codex-activity__heading">
    <div>
      <h2>Token 用量</h2>
      <p class="codex-activity__subtitle" data-subtitle>每日 Token 用量</p>
    </div>
    <div class="codex-activity__modes" role="group" aria-label="统计方式">
      <button type="button" data-mode="daily" aria-pressed="true">每天</button>
      <button type="button" data-mode="weekly" aria-pressed="false">每周</button>
      <button type="button" data-mode="cumulative" aria-pressed="false">累计总量</button>
    </div>
  </div>
  <div class="codex-activity__metrics" aria-label="用量摘要">
    <div><span>今天</span><strong data-metric="today">—</strong><small>tokens</small></div>
    <div><span>最近 7 天</span><strong data-metric="week">—</strong><small>tokens</small></div>
    <div><span data-total-label>已记录总量</span><strong data-metric="total">—</strong><small>tokens</small></div>
  </div>
  <p class="codex-activity__status" data-status role="status">正在读取 Token 用量…</p>
  <div class="codex-activity__visual" data-visual hidden>
    <div class="codex-activity__scroll" tabindex="0" aria-label="过去 12 个日历月的用量图，可横向滚动">
      <div class="codex-activity__chart">
        <div class="codex-activity__months" data-months aria-hidden="true"></div>
        <div class="codex-activity__grid" data-grid role="group" aria-label="每日用量；方向键可切换日期"></div>
      </div>
    </div>
    <div class="codex-activity__legend"><span data-mode-note>每格一天</span><span class="codex-activity__legend-scale" aria-label="颜色越深，Token 用量越多">少 <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i> 多</span></div>
    <p class="codex-activity__detail" data-detail aria-live="polite" aria-atomic="true">悬停、点击或用方向键选择格子，查看准确用量。</p>
  </div>
  <p class="codex-activity__updated" data-updated></p>
  <p class="codex-activity__footnote" data-footnote>展示最近一次同步的使用记录；空白日期表示没有已同步记录。</p>
  <noscript><p>请启用 JavaScript 查看每日用量。也可以查看<a href="{{ '/assets/data/codex-usage.json' | relative_url }}">公开的每日汇总数据</a>。</p></noscript>
</section>
<script src="{{ '/assets/js/codex-activity.js' | relative_url }}" defer></script>
